name: mss301-shared
services:
  mysql:
    extends:
      file: ./order-service/docker-compose.yml
      service: mysql
  order-service:
    build: ./order-service
    environment:
      DB_URL: jdbc:mysql://mysql:3306/order_service?allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mysql}
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
  inventory-service:
    build: ./inventory-service
    environment:
      DB_URL: jdbc:mysql://mysql:3306/inventory_service?allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mysql}
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
