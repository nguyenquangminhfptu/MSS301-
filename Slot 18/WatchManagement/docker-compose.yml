services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_PASSWORD:-YourStrong@Password123}"
    ports: ["1433:1433"]
    volumes: ["sqldata:/var/opt/mssql"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on: {sqlserver: {condition: service_healthy}}
    environment: {DB_PASSWORD: "${DB_PASSWORD:-YourStrong@Password123}"}
    entrypoint: ["/bin/bash", "-c", "/opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P \"$$DB_PASSWORD\" -C -Q \"IF DB_ID('DBAccount') IS NULL CREATE DATABASE DBAccount; IF DB_ID('DBBrand') IS NULL CREATE DATABASE DBBrand; IF DB_ID('DBWatch') IS NULL CREATE DATABASE DBWatch;\""]
    restart: "no"
  ms-account:
    build: ./MSAccount_DE190270
    ports: ["8081:8081"]
    environment:
      DB_HOST: sqlserver
      DB_PASSWORD: "${DB_PASSWORD:-YourStrong@Password123}"
      JWT_SECRET: "${JWT_SECRET:-mss301-watch-management-secret-key-2025-very-long-string}"
      JWT_EXPIRATION: "${JWT_EXPIRATION:-900000}"
      REFRESH_EXPIRATION: "${REFRESH_EXPIRATION:-604800000}"
    depends_on: {db-init: {condition: service_completed_successfully}}
  ms-brand:
    build: ./MSBrand_DE190270
    ports: ["8082:8082"]
    environment: {DB_HOST: sqlserver, DB_PASSWORD: "${DB_PASSWORD:-YourStrong@Password123}"}
    depends_on: {db-init: {condition: service_completed_successfully}}
  ms-watch:
    build: ./MSWatch_DE190270
    ports: ["8083:8083"]
    environment:
      DB_HOST: sqlserver
      DB_PASSWORD: "${DB_PASSWORD:-YourStrong@Password123}"
      BRAND_SERVICE_URL: http://ms-brand:8082
      SAGA_FAULT_INJECTION: "${SAGA_FAULT_INJECTION:-true}"
    depends_on:
      db-init: {condition: service_completed_successfully}
      ms-brand: {condition: service_started}
  api-gateway:
    build: ./APIGateway_DE190270
    ports: ["8080:8080"]
    environment:
      JWT_SECRET: "${JWT_SECRET:-mss301-watch-management-secret-key-2025-very-long-string}"
      ACCOUNT_SERVICE_URL: http://ms-account:8081
      BRAND_SERVICE_URL: http://ms-brand:8082
      WATCH_SERVICE_URL: http://ms-watch:8083
    depends_on: [ms-account, ms-brand, ms-watch]
volumes:
  sqldata:
